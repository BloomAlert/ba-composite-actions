# Reusable ETL conformance check (etl-template docs/standard.md, CI-06).
# Runs etl-template's scripts/conformance.py, at the tag the caller's
# .copier-answers.yml pins, against the caller repo. --template is the same
# checkout, so SHARED-02 (template-owned files unedited) really runs.
# etl-template itself (it has copier.yml) is checked with its own script.
name: etl-conformance

on:
  workflow_call:
    inputs:
      warn:
        description: Report FAILs without failing (until the repo converges)
        type: boolean
        default: true
    secrets:
      # A GitHub App installed on etl-template only, Contents: read.
      # etl-template is private, so the caller's GITHUB_TOKEN can't read it.
      # Org secrets, in both Actions and Dependabot (Dependabot PRs see only
      # Dependabot secrets).
      ETL_TEMPLATE_APP_CLIENT_ID:
        required: false
      ETL_TEMPLATE_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  conformance:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      - name: Template ref
        id: ref
        env:
          CLIENT_ID: ${{ secrets.ETL_TEMPLATE_APP_CLIENT_ID }}
          KEY_SET: ${{ secrets.ETL_TEMPLATE_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ -f repo/copier.yml ]]; then
            echo "self=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # .copier-answers.yml is flat YAML written by copier: `_commit: v1.1.0`.
          ref=$(sed -n 's/^_commit:[[:space:]]*//p' repo/.copier-answers.yml 2>/dev/null | tr -d "'\"")
          [[ -n "$ref" ]] \
            || { echo "::error::no _commit in .copier-answers.yml: adopt etl-template with copier first (SHARED-01)"; exit 1; }
          # copier writes a git-describe string when copied from an untagged commit
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::_commit '$ref' is not a release tag: copier copy/update with --vcs-ref vX.Y.Z"; exit 1; }
          [[ -n "$CLIENT_ID" && "$KEY_SET" == true ]] \
            || { echo "::error::ETL_TEMPLATE_APP_CLIENT_ID / ETL_TEMPLATE_APP_PRIVATE_KEY not set for this repo: org secrets, in Actions and in Dependabot (docs/etl-workflows.md)"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - id: token
        if: steps.ref.outputs.self != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ETL_TEMPLATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ETL_TEMPLATE_APP_PRIVATE_KEY }}
          owner: BloomAlert
          repositories: etl-template
          permission-contents: read

      - if: steps.ref.outputs.self != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BloomAlert/etl-template
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ steps.token.outputs.token }}
          path: template
          fetch-depth: 0 # SHARED-02 runs `git ls-tree <tag>` in it
          persist-credentials: false

      # Stdlib only; no uv: pr_checks already runs `uv lock --check` (PKG-03).
      - name: Conformance
        env:
          SELF: ${{ steps.ref.outputs.self }}
          WARN: ${{ inputs.warn && '--warn' || '' }}
        run: |
          if [[ "$SELF" == true ]]; then
            python3 repo/scripts/conformance.py repo $WARN
          else
            python3 template/scripts/conformance.py repo --template template $WARN
          fi
