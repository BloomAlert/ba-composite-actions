# Reusable ETL build (docs/etl-workflows.md). Builds one flow's image, pushes :<github.sha>.
# Unsupported: private package indexes at build time (e.g. bloompy from a GAR `index_url`); no fleet ETL uses one.
name: etl-build

on:
  workflow_call:
    inputs:
      environment:
        description: staging | prod; must equal the branch being built
        type: string
        required: true
      declaration:
        description: Path of the flow's runtime declaration
        type: string
        default: deploy/runtime.yaml
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_ARTIFACT_REGISTRY_WRITER_SA:
        required: true
    outputs:
      image:
        description: Pushed image URI (:<sha>)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Pushed image digest
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Guard environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # the image is tagged with github.sha, so it must come from the env branch
          [[ "$ENVIRONMENT" =~ ^(staging|prod)$ && "$ENVIRONMENT" == "$GITHUB_REF_NAME" ]] \
            || { echo "::error::environment '$ENVIRONMENT' must be staging|prod and equal the ref '$GITHUB_REF_NAME'"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        env:
          DECL: ${{ inputs.declaration }}
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          AR_REPO="${GITHUB_REPOSITORY#*/}-${ENVIRONMENT}"
          IMAGE_NAME=$(yq -e '.image' "$DECL")
          {
            echo "ar_repo=$AR_REPO"
            echo "dockerfile=$(yq -e '.dockerfile' "$DECL")"
            echo "image_name=$IMAGE_NAME"
            echo "image=${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_ARTIFACT_REGISTRY_WRITER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Ensure AR repo + docker auth
        env:
          AR_REPO: ${{ steps.meta.outputs.ar_repo }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          if ! gcloud artifacts repositories describe "$AR_REPO" --location="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$AR_REPO" --repository-format=docker \
              --location="$REGION" --project="$PROJECT" --description="Docker images for ${AR_REPO}"
            # RUN-05, set once at creation; keep in sync with etl/ar-cleanup-policy.json (test_render.py checks).
            # Existing repos: etl/ar_cleanup.py (one-off, dry-run by default).
            cat > "$RUNNER_TEMP/ar-policy.json" <<'JSON'
          [
            {"name": "keep-last-10", "action": {"type": "Keep"}, "mostRecentVersions": {"keepCount": 10}},
            {"name": "delete-tagged", "action": {"type": "Delete"}, "condition": {"tagState": "tagged"}},
            {"name": "delete-untagged-7d", "action": {"type": "Delete"}, "condition": {"tagState": "untagged", "olderThan": "7d"}}
          ]
          JSON
            gcloud artifacts repositories set-cleanup-policies "$AR_REPO" --location="$REGION" --project="$PROJECT" \
              --policy="$RUNNER_TEMP/ar-policy.json" --no-dry-run
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.image_name }}
