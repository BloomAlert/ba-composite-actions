# Generic Cloud Workflow, one per flow (RUN-01). etl-deploy sets its env from an env-vars file:
#   GCP_PROJECT_ID, GCP_REGION, ENVIRONMENT, JOB_NAME, JOB_TIMEOUT_SECONDS, NOTIFY_URL,
#   RETRY_COUNT (0 = no retry), RETRY_BACKOFF_SECONDS, NEXT_WORKFLOW ("none" = no chaining).
# Input: {"args": [...], "labels": {...}, "chain": bool, "retry": int}, all optional; any other key or a wrong type
# notifies job_failed and raises before the job runs. "chain": false (default true) skips NEXT_WORKFLOW
# for this run; "retry": n lowers RETRY_COUNT for this run only (clamped to it; invalid -> ignored and logged).
# Manual run:
#   gcloud workflows run <name> --data='{"args":["--start-date","2026-10-01"],"labels":{"instance":"manual"}}'
main:
  params: [input]
  steps:
    - init:
        assign:
          - empty: {}  # Workflows expressions have no map literal; default in two steps
          - input: ${default(input, empty)}  # no --data → null; map.delete (start_next) needs a map
          - allowed: [args, labels, chain, retry]
          - shape: '{"args": [string, ...], "labels": {...}, "chain": bool, "retry": int}'
          - bad: null  # why the input is rejected; declared here so the for loops below can set it

    # #21 fail fast: an unknown key (e.g. "start_dt") or a wrong type must not silently run the job's default window
    - check_input:
        switch:
          - condition: ${get_type(input) != "map"}
            assign:
              - bad: ${"input must be a JSON object, got " + get_type(input)}
            next: reject_input
    - check_keys:
        for:
          value: key
          in: ${keys(input)}
          steps:
            - unknown_key:
                switch:
                  - condition: ${not(key in allowed)}
                    assign:
                      - bad: ${"input has unknown key " + json.encode_to_string(key)}
                    next: break

    - read_input:
        assign:
          - final_args_list: ${default(map.get(input, "args"), [])}
          - labels: ${default(map.get(input, "labels"), empty)}
          - chain: ${default(map.get(input, "chain"), true)}
          - retry: ${map.get(input, "retry")}
          - project: ${sys.get_env("GCP_PROJECT_ID")}
          - region: ${sys.get_env("GCP_REGION")}
          - job_name: ${sys.get_env("JOB_NAME")}
          - max_attempts: ${int(sys.get_env("RETRY_COUNT")) + 1}
          - backoff: ${int(sys.get_env("RETRY_BACKOFF_SECONDS"))}
          - next_workflow: ${sys.get_env("NEXT_WORKFLOW")}
          - err: null
          - execution: null  # the failed attempt's Execution, if it started
          - job_op: null

    - check_types:  # "chain": "false" must not silently start NEXT_WORKFLOW
        switch:
          - condition: ${bad != null}
            next: reject_input
          - condition: ${get_type(final_args_list) != "list"}
            assign:
              - bad: ${"input.args must be a list of strings, got " + json.encode_to_string(final_args_list)}
            next: reject_input
          - condition: ${get_type(labels) != "map"}
            assign:
              - bad: ${"input.labels must be an object, got " + json.encode_to_string(labels)}
            next: reject_input
          - condition: ${get_type(chain) != "boolean"}
            assign:
              - bad: ${"input.chain must be true or false, got " + json.encode_to_string(chain)}
            next: reject_input
    - check_arg_items:  # a non-string arg gets a Cloud Run 400 that the loop would retry RETRY_COUNT times
        for:
          value: arg
          in: ${final_args_list}
          steps:
            - non_string_arg:
                switch:
                  - condition: ${get_type(arg) != "string"}
                    assign:
                      - bad: ${"input.args must be a list of strings, got " + json.encode_to_string(final_args_list)}
                    next: break
    - input_ok:
        switch:
          - condition: ${bad == null}
            next: override_retry
    - reject_input:  # notify first: fire-and-forget callers would otherwise trade a wrong window for no run at all
        steps:
          - notify_bad_input:
              call: notify
              args:
                event_type: job_failed
                execution: null
                summary: ${bad + "; expected " + shape}
                labels: ${empty}
                extra:
                  input: ${json.encode_to_string(input)}
          - raise_bad_input:
              raise: ${bad + "; expected " + shape}

    - override_retry:  # fail-soft: a bad value keeps RETRY_COUNT; a run can lower retries, never raise them
        switch:
          - condition: ${retry == null}
            next: attempts
          - condition: ${get_type(retry) != "integer"}  # separate conditions: `or` would compare a string to 0
            next: log_bad_retry
          - condition: ${retry < 0}
            next: log_bad_retry
    - clamp_retry:  # min before +1: retry + 1 could overflow int64
        assign:
          - max_attempts: ${math.min(retry, max_attempts - 1) + 1}
        next: attempts
    - log_bad_retry:
        call: sys.log
        args:
          severity: WARNING
          text: ${"input.retry ignored, must be an integer >= 0, got " + json.encode_to_string(retry)}

    - attempts:
        for:
          value: attempt
          range:
            - 1
            - ${max_attempts}
          steps:
            - reset:
                assign:
                  - err: null
            - run_job:
                try:
                  call: googleapis.run.v2.projects.locations.jobs.run
                  args:
                    name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job_name}
                    body:
                      overrides:
                        containerOverrides:
                          - args: ${final_args_list}
                    connector_params:
                      timeout: ${int(sys.get_env("JOB_TIMEOUT_SECONDS")) + 600}
                      polling_policy:
                        initial_delay: 10.0
                        multiplier: 1.0
                        max_delay: 10.0
                  result: job_op
                except:
                  as: e
                  steps:
                    - keep_error:
                        assign:
                          - err: ${e}
                          # connectors raise OperationError carrying the failed LRO, whose metadata is the Execution
                          - execution: ${map.get(e, ["operation", "metadata", "name"])}
            - succeeded:
                switch:
                  - condition: ${err == null}
                    next: break
            - wait_before_retry:  # only the last attempt notifies (give_up); earlier ones log a WARNING
                # (the Cloud Run error message carries the exit code: "Task … failed with exit code: 1 …")
                switch:
                  - condition: ${attempt < max_attempts}
                    steps:
                      - log_failed_attempt:
                          call: sys.log
                          args:
                            severity: WARNING
                            text: '${"attempt " + string(attempt) + "/" + string(max_attempts) + " failed, retrying in " + string(backoff) + " s (" + default(execution, "not started") + "): " + default(map.get(err, ["operation", "error", "message"]), json.encode_to_string(err))}'
                      - sleep:
                          call: sys.sleep
                          args:
                            seconds: ${backoff}

    - give_up:
        switch:
          - condition: ${err != null}
            steps:
              - notify_failure:  # every attempt failed: attempt is max/max (the loop variable is local to it)
                  call: notify
                  args:
                    event_type: job_failed
                    execution: ${execution}
                    summary: ${default(map.get(err, "message"), json.encode_to_string(err))}
                    labels: ${labels}
                    extra:
                      attempt: ${string(max_attempts) + "/" + string(max_attempts)}
                      args: ${json.encode_to_string(final_args_list)}
              - reraise:
                  raise: ${err}

    # ALERT-02: ba-ops-notify uses this for "recovered" replies and the daily ok count
    - notify_success:
        call: notify
        args:
          event_type: job_succeeded
          execution: ${map.get(job_op, "name")}
          summary: ${job_name + " succeeded"}
          labels: ${labels}
          extra:
            args: ${json.encode_to_string(final_args_list)}

    - start_next:
        switch:
          - condition: ${next_workflow != "none" and chain}
            steps:
              - create_next_execution:
                  call: googleapis.workflowexecutions.v1.projects.locations.workflows.executions.create
                  args:
                    parent: ${"projects/" + project + "/locations/" + region + "/workflows/" + next_workflow}
                    body:
                      argument: ${json.encode_to_string(map.delete(map.delete(input, "chain"), "retry"))}
                      labels: ${labels}

    - done:
        return: ${job_name + " finished"}

# One typed v2 ba-ops-notify event (ALERT-01/02). Fail-soft: a notifier error is logged, never raised.
notify:
  params: [event_type, execution, summary, labels, extra]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GCP_PROJECT_ID")}
          - region: ${sys.get_env("GCP_REGION")}
          - job_name: ${sys.get_env("JOB_NAME")}
          - exit_code: ${if(event_type == "job_failed", "unknown", "0")}
          - cause: null  # declared here: a variable first set inside a for loop is local to it
          # APP-05 exit codes
          - exit_classes:
              "0": ok
              "1": bug
              "2": config
              "3": transient source
          - console: https://console.cloud.google.com/run/jobs/
          - log_uri: ${console + "details/" + region + "/" + job_name + "/logs?project=" + project}
    - read_exit_code:
        switch:
          - condition: ${execution != null}
            steps:
              - execution_link:
                  assign:
                    - parts: ${text.split(execution, "/")}
                    - execution_id: ${parts[len(parts) - 1]}
                    - log_uri: ${console + "executions/details/" + region + "/" + execution_id + "/logs?project=" + project}
              - exit_code_lookup:  # success is exit 0 by definition
                  switch:
                    - condition: ${event_type == "job_failed"}
                      steps:
                        - list_tasks_try:
                            try:
                              steps:
                                - list_tasks:
                                    call: googleapis.run.v2.projects.locations.jobs.executions.tasks.list
                                    args:
                                      parent: ${execution}
                                    result: task_page
                                - first_task_code:
                                    assign:
                                      - exit_code: ${string(task_page.tasks[0].lastAttemptResult.exitCode)}
                            except:
                              as: ignored
                              steps:
                                - keep_unknown:
                                    assign:
                                      - exit_code: "unknown"
                        # ALERT-01: the cause is the one ERROR line src/shared/entrypoint.py logs (json_fields
                        # error + exit_code). Fail-soft: no entry, no permission or any error -> the generic summary.
                        - cause_lookup:
                            try:
                              steps:
                                - poll_logs:  # stdout reaches Cloud Logging a few seconds after the exit
                                    # ponytail: a repo not on entrypoint.py never matches, so its alert waits all 3 tries
                                    # (~15 s); gate on a label if that delay matters before the fleet migrates
                                    for:
                                      value: lookup
                                      range: [1, 3]
                                      steps:
                                        - wait_for_logs:
                                            call: sys.sleep
                                            args:
                                              seconds: 5
                                        - list_entries:  # no Workflows connector for Logging; plain REST
                                            call: http.post
                                            args:
                                              url: https://logging.googleapis.com/v2/entries:list
                                              auth:
                                                type: OAuth2
                                              body:
                                                resourceNames:
                                                  - ${"projects/" + project}
                                                filter: '${"resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"" + job_name + "\" AND labels.\"run.googleapis.com/execution_name\"=\"" + execution_id + "\" AND severity>=ERROR AND jsonPayload.exit_code:* AND timestamp>=\"" + time.format(sys.now() - 3600) + "\""}'
                                                orderBy: timestamp desc
                                                pageSize: 1
                                            result: log_resp
                                        - found:  # the message minus a traceback
                                            switch:
                                              - condition: ${"entries" in log_resp.body}
                                                assign:
                                                  - cause: ${text.split(log_resp.body.entries[0].jsonPayload.message, "\nTraceback")[0]}
                                                next: break
                                - cap_cause:  # capped for Slack; an empty cause falls back to the summary too
                                    switch:
                                      - condition: ${cause == ""}
                                        assign:
                                          - cause: null
                                      - condition: ${len(default(cause, "")) > 500}
                                        assign:
                                          - cause: ${text.substring(cause, 0, 497) + "..."}
                            except:
                              as: ignored
                              steps:
                                - no_cause:
                                    assign:
                                      - cause: null
    - classify:
        assign:
          - context: ${map.merge(labels, extra)}
          - context["exit_class"]: ${default(map.get(exit_classes, exit_code), "unknown")}
          - context["exit_code"]: ${exit_code}
          - context["execution"]: ${default(execution, "not started")}
          - exit_class: ${context["exit_class"]}
    - post:
        try:
          call: http.post
          args:
            url: ${sys.get_env("NOTIFY_URL")}
            auth:
              type: OIDC
            body:
              schema_version: 2
              source:
                job_name: ${job_name}
                gcp_project_id: ${project}
                gcp_region: ${region}
                environment: ${sys.get_env("ENVIRONMENT")}
              event:
                event_type: ${event_type}
                severity: ${if(event_type == "job_failed", "ERROR", "INFO")}
                title: ${job_name + if(event_type == "job_failed", " failed (exit " + exit_code + ", " + exit_class + ")", " succeeded")}
                summary: ${default(cause, summary)}
                context: ${context}
                log_uri: ${log_uri}
        except:
          as: notify_error
          steps:
            - log_notify_error:
                call: sys.log
                args:
                  severity: ERROR
                  json: ${notify_error}
