# deploy/runtime.yaml in etl-ingestion-stormglass-gcp
dockerfile: Dockerfile
image: main
job:
  service_account_var: GCP_JOB_SERVICE_ACCOUNT_EMAIL
  cpu: 1
  memory: 2Gi
  timeout: 600s
env:
  - USERS_SERVICE
  - AUTH0_DOMAIN
  - AUTH0_AUDIENCE
  - AUTH0_CLIENT_ID
  - REDIS_HOST_TOKEN_CACHE
  - REDIS_PORT_TOKEN_CACHE
  - INFLUXDB_HOST
  - INFLUXDB_ORG
  - INFLUXDB_BUCKET
  - GCP_BIGQUERY_RAW_TABLE
  - REDIS_PASS_TOKEN_CACHE_KEY
  - INFLUXDB_TOKEN_KEY
  - STORMGLASS_SECRET_KEY
  - SATELLITE_AUTH0_CLIENT_SECRET_KEY
time_zone: America/Santiago
instances:  # replaces: the exact per-instance resources this instance supersedes (RUN-04)
  - name: wh-01
    schedule: "0 13 * * *"
    args: [--ts-id, WH-01]
    replaces:
      - etl-stormglass-ingestion-wh-01-{env}
      - workflow-stormglass-ingestion-wh-01-{env}
      - schedule-stormglass-ingestion-wh-01-{env}
  - name: wh-02
    schedule: "0 13 * * *"
    args: [--ts-id, WH-02]
    replaces:
      - etl-stormglass-ingestion-wh-02-{env}
      - workflow-stormglass-ingestion-wh-02-{env}
      - schedule-stormglass-ingestion-wh-02-{env}
  - name: wad-01
    schedule: "0 13 * * *"
    args: [--ts-id, WAD-01]
    replaces:
      - etl-stormglass-ingestion-wad-01-{env}
      - workflow-stormglass-ingestion-wad-01-{env}
      - schedule-stormglass-ingestion-wad-01-{env}
  - name: wid-01
    schedule: "0 13 * * *"
    args: [--ts-id, WID-01]
    replaces:
      - etl-stormglass-ingestion-wid-01-{env}
      - workflow-stormglass-ingestion-wid-01-{env}
      - schedule-stormglass-ingestion-wid-01-{env}
  - name: wis-01
    schedule: "0 13 * * *"
    args: [--ts-id, WIS-01]
    replaces:
      - etl-stormglass-ingestion-wis-01-{env}
      - workflow-stormglass-ingestion-wis-01-{env}
      - schedule-stormglass-ingestion-wis-01-{env}
  - name: wap-01
    schedule: "0 13 * * *"
