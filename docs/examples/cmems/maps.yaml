# deploy/maps.yaml in etl-ingestion-cmems-gcp (tier wp-md-push: 31 products)
flow: maps
dockerfile: Dockerfile.maps
image: map                       # both tiers run the same image
job:
  service_account_var: GCP_MAP_JOB_SERVICE_ACCOUNT_EMAIL
  cpu: 2
  memory: 4Gi
  timeout: 900s
env:
  - USE_CLOUD_LOGGING
  - GCP_BUCKET_NAME=GCP_MAPS_BUCKET
  - MAP_ARRIVAL_TOPIC
time_zone: America/Santiago
retry: {count: 16, backoff_seconds: 1800}   # was map_retry in every scheduler payload
next: etl-ingestion-cmems-timeseries          # was trigger_timeseries; gets the same args/labels
instances:  # replaces: the exact old resources this instance supersedes (RUN-04)
  - name: spm-01
    schedule: "0 8 * * *"
    args: [--ts-id, SPM-01, --publish-arrival, --source, nrt]
    replaces:
      - etl-map-ingestion-spm-01-{env}
      - workflow-map-ingestion-spm-01-{env}
      - schedule-map-ingestion-spm-01-{env}
  - name: spm-01-middle-east
    schedule: "0 7 * * *"
    args: [--ts-id, SPM-01, --region, middle-east, --source, auto]
    replaces:
      - schedule-map-ingestion-spm-01-middle-east-{env}
  - name: chl-01
    schedule: "5 8 * * *"
    args: [--ts-id, CHL-01, --publish-arrival, --source, nrt]
    replaces:
