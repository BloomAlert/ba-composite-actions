# deploy/maps.yaml in etl-ingestion-cmems-gcp (tier wp-md-push: 31 products)
flow: maps
dockerfile: Dockerfile.maps
image: map                       # both tiers run the same image
job:
  service_account_var: GCP_MAP_JOB_SERVICE_ACCOUNT_EMAIL
  cpu: 2
  memory: 4Gi
  timeout: 900s
env:
  - USE_CLOUD_LOGGING
  - GCP_BUCKET_NAME=GCP_MAPS_BUCKET
  - MAP_ARRIVAL_TOPIC
time_zone: America/Santiago
retry: {count: 16, backoff_seconds: 1800}   # was map_retry in every scheduler payload
next: etl-ingestion-cmems-timeseries          # was trigger_timeseries; gets the same args/labels
instances:
  - {name: spm-01, schedule: "0 8 * * *", args: [--ts-id, SPM-01, --publish-arrival, --source, nrt]}
  - {name: spm-01-middle-east, schedule: "0 7 * * *", args: [--ts-id, SPM-01, --region, middle-east, --source, auto]}
  - {name: chl-01, schedule: "5 8 * * *", args: [--ts-id, CHL-01, --publish-arrival, --source, nrt]}
  - {name: chl-01-middle-east, schedule: "0 7 * * *", args: [--ts-id, CHL-01, --region, middle-east, --source, auto]}
  - {name: zsd-01, schedule: "10 8 * * *", args: [--ts-id, ZSD-01, --publish-arrival, --source, nrt]}
  - {name: zsd-01-middle-east, schedule: "0 7 * * *", args: [--ts-id, ZSD-01, --region, middle-east, --source, auto]}
  - {name: sst-02, schedule: "20 8 * * *", args: [--ts-id, SST-02, --publish-arrival, --source, nrt]}
  - {name: sst-02-middle-east, schedule: "0 7 * * *", args: [--ts-id, SST-02, --region, middle-east, --source, auto]}
  - {name: uo-01, schedule: "20 8 * * *", args: [--ts-id, UO-01, --publish-arrival, --source, nrt]}
  - {name: vo-01, schedule: "20 8 * * *", args: [--ts-id, VO-01, --publish-arrival, --source, nrt]}
  - {name: so-01, schedule: "20 8 * * *", args: [--ts-id, SO-01, --publish-arrival, --source, nrt]}
  - {name: wo-01, schedule: "20 8 * * *", args: [--ts-id, WO-01, --publish-arrival, --source, nrt]}
  - {name: nppv-01, schedule: "25 9 * * *", args: [--ts-id, NPPV-01, --publish-arrival, --source, nrt]}
  - {name: o2-01, schedule: "25 9 * * *", args: [--ts-id, O2-01, --publish-arrival, --source, nrt]}
  - {name: dissic-01, schedule: "25 9 * * *", args: [--ts-id, DISSIC-01, --publish-arrival, --source, nrt]}
  - {name: ph-01, schedule: "25 9 * * *", args: [--ts-id, PH-01, --publish-arrival, --source, nrt]}
  - {name: talk-01, schedule: "30 9 * * *", args: [--ts-id, TALK-01, --publish-arrival, --source, nrt]}
  - {name: spco2-01, schedule: "30 9 * * *", args: [--ts-id, SPCO2-01, --publish-arrival, --source, nrt]}
  - {name: fe-01, schedule: "30 9 * * *", args: [--ts-id, FE-01, --publish-arrival, --source, nrt]}
  - {name: no3-01, schedule: "30 9 * * *", args: [--ts-id, NO3-01, --publish-arrival, --source, nrt]}
  - {name: po4-01, schedule: "30 9 * * *", args: [--ts-id, PO4-01, --publish-arrival, --source, nrt]}
  - {name: si-01, schedule: "45 9 * * *", args: [--ts-id, SI-01, --publish-arrival, --source, nrt]}
