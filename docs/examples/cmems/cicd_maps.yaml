# .github/workflows/cicd_maps.yaml in etl-ingestion-cmems-gcp: one image, two resource tiers
name: cicd-maps

on:
  push:
    branches: [staging, prod]
    paths:
      - ".github/workflows/cicd_maps.yaml"
      - "deploy/maps*.yaml"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.maps"
  workflow_dispatch: # run it from the staging or prod branch
    inputs:
      dry_run:
        description: Print the gcloud plan and orphans only
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write
    uses: BloomAlert/ba-composite-actions/.github/workflows/etl-build.yaml@<40-hex sha> # v1.0.0
    with:
      environment: ${{ github.ref_name }}
      declaration: deploy/maps.yaml # both tiers share image `map`
    secrets: inherit

  # maps-large first: `maps` pauses every legacy map scheduler, so the large tier's new ones must exist by then
  deploy-maps-large:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
    uses: BloomAlert/ba-composite-actions/.github/workflows/etl-deploy.yaml@<40-hex sha> # v1.0.0
    with:
      environment: ${{ github.ref_name }}
      declaration: deploy/maps-large.yaml
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit

  deploy-maps:
    needs: deploy-maps-large
    if: ${{ !cancelled() && needs.deploy-maps-large.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: BloomAlert/ba-composite-actions/.github/workflows/etl-deploy.yaml@<40-hex sha> # v1.0.0
    with:
      environment: ${{ github.ref_name }}
      declaration: deploy/maps.yaml
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
