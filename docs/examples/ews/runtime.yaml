# deploy/runtime.yaml in etl-ingestion-ews-gcp (one file per flow; single-flow repo -> no `flow`)
# Existing single-job repo: keeps its current names, so adoption is an in-place update (no cutover).
name: etl-ews-ingestion                  # job etl-ews-ingestion-<env>
workflow_name: workflow-ews-ingestion    # workflow-ews-ingestion-<env>
scheduler_name: schedule-ews-ingestion   # schedule-ews-ingestion-<env> (one instance, so no {instance})
time_zone: America/Santiago
dockerfile: Dockerfile
image: main
job:
  service_account_var: GCP_JOB_SERVICE_ACCOUNT_EMAIL
  cpu: 1
  memory: 2Gi
  timeout: 600s
env:
  - INGESTION_SERVICE
  - AUTH0_DOMAIN
  - AUTH0_AUDIENCE
  - AUTH0_CLIENT_ID
  - SFTP_HOST
  - SFTP_USER
  - SFTP_REMOTE_FOLDER
  - SFTP_BANNER_TIMEOUT?
  - REDIS_HOST
  - REDIS_PORT
  - REDIS_DATABASE_NAME
  - REDIS_HOST_TOKEN_CACHE
  - REDIS_PORT_TOKEN_CACHE
  - REDIS_PASS_HASH_CACHE_KEY
  - REDIS_PASS_TOKEN_CACHE_KEY
  - AUTH0_CLIENT_SECRET_KEY
  - SFTP_PRIVATE_KEY_KEY
  - SFTP_PRIVATE_KEY_PASS_KEY
instances:
  - name: main
    schedule: "*/15 * * * *"
